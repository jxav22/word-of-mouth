services:
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - WOM_DATA_DIR=/app/data
      - WOM_REFRESH_MINUTES=30
      # Optional:
      # - OPENAI_API_KEY=
      # - ANTHROPIC_API_KEY=
    volumes:
      - wom-data:/app/data
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped

volumes:
  wom-data:
